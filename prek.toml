minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "fix-byte-order-marker" },
    { id = "pretty-format-json", args = ["--autofix", "--no-sort-keys", "--indent", "4"] },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"

# Every hook is a single alr command; tools (gnatformat, gnatprove, gnatcov) come from tests/alire.toml.
# alr exec does not generate config/*.gpr, so alr-generate runs first in both stages.

[[repos.hooks]]
id = "alr-generate"
name = "alr generate config"
language = "system"
entry = "alr -n -q -C tests build --stop-after=generation"
files = '\.(ads|adb|adc|gpr|toml)$'
pass_filenames = false
stages = ["pre-commit", "pre-push"]
priority = 0

# pre-commit: fixers first (by priority), then checks

[[repos.hooks]]
id = "gnatformat"
name = "gnatformat (src)"
language = "system"
entry = "alr -n -q -C tests exec -- gnatformat -P ../template.gpr"
files = '\.(ads|adb|gpr)$'
pass_filenames = false
stages = ["pre-commit"]
priority = 10

[[repos.hooks]]
id = "gnatformat-tests"
name = "gnatformat (tests)"
language = "system"
entry = "alr -n -q -C tests exec -- gnatformat --no-subprojects -P template_tests.gpr"
files = '\.(ads|adb|gpr)$'
pass_filenames = false
stages = ["pre-commit"]
priority = 10

# Also enforces SPARK: spark.adc rejects any SPARK_Mode pragma/aspect (no opting out) in src/.

[[repos.hooks]]
id = "alr-build"
name = "alr build"
language = "system"
entry = "alr -n -q build"
files = '\.(ads|adb|adc|gpr|toml)$'
pass_filenames = false
stages = ["pre-commit"]
priority = 20

# pre-push

[[repos.hooks]]
id = "alr-test"
name = "alr test"
language = "system"
entry = "alr -n -q test"
files = '\.(ads|adb|adc|gpr|toml)$'
pass_filenames = false
stages = ["pre-push"]
priority = 10

[[repos.hooks]]
id = "coverage"
name = "gnatcov coverage (min 80%)"
language = "system"
entry = "alr -n -q -C tests run coverage --args=80"
files = '\.(ads|adb|adc|gpr|toml)$'
pass_filenames = false
stages = ["pre-push"]
priority = 15

[[repos.hooks]]
id = "gnatprove"
name = "gnatprove (SPARK)"
language = "system"
entry = "alr -n -q -C tests exec -- gnatprove -P ../template.gpr"
files = '\.(ads|adb|adc|gpr|toml)$'
pass_filenames = false
stages = ["pre-push"]
priority = 20
